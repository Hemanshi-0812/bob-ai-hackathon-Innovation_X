services:
  mongo:
    image: mongo:7
    container_name: supplyguard-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - supplyguard_mongo_data:/data/db

  backend:
    build:
      context: ./src/backend
    container_name: supplyguard-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/supplyguard
    ports:
      - "5000:5000"
    depends_on:
      - mongo

  frontend:
    build:
      context: ./src/frontend
    container_name: supplyguard-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  supplyguard_mongo_data: