submission:
  problem_id: L2
  track: Logistics & Ports
  title: SupplyGuard AI — Supply Chain Disruption Assistant & Fleet Utilisation Optimizer
  status: Ongoing Pain

  problem_statement: >
    Supply chain disruptions cascade across hundreds of active shipments in
    ways that are impossible to track manually, while idle fleet assets sit
    unused and cold-chain cargo can silently spoil in transit. Logistics
    teams need a unified system to detect disruptions, analyse affected
    shipments, optimise routes, utilise fleet capacity, and monitor
    temperature-sensitive cargo.

  solution_summary: >
    SupplyGuard AI is a ten-module Bob-powered supply chain disruption
    assistant that covers the full operational loop. It provides an
    Executive Dashboard, Shipment Management, Disruption Detection,
    Affected Shipment and Risk Analysis, AI Rerouting Recommendation,
    Idle Fleet Detection, Fleet Redeployment Recommendation, IoT
    Cold-Chain Monitoring, Temperature Excursion and Severity Detection,
    and the Bob AI Copilot chat.

  key_features:
    - Executive Dashboard
    - Shipment Management
    - Disruption Detection
    - Affected Shipment and Risk Analysis
    - AI Rerouting Recommendation
    - Idle Fleet Detection
    - Fleet Redeployment Recommendation
    - IoT Cold-Chain Monitoring
    - Temperature Excursion and Severity Detection
    - Bob AI Copilot

  tech_stack:
    frontend:
      - React.js
      - Vite
    ui:
      - MUI
    charts:
      - Recharts
    maps:
      - React Leaflet
    backend:
      - Node.js
      - Express.js
    database:
